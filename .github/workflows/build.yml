name: Build NgalongTube APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: 'stable'
      - name: Generate android folder
        run: |
          flutter create -t app --platforms=android --project-name ngalong_tube temp_proj
          cp -r temp_proj/android ./android
          rm -rf temp_proj
          flutter pub get
      - name: Build APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: ngalongtube-apk
          path: build/app/outputs/flutter-apk/app-release.apk
